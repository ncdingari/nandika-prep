<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- owl-4: head tilted, one eyebrow raised (curious/thinking pose) -->

  <!-- whole owl is rotated slightly -->
  <g transform="rotate(-12,40,48)">

    <!-- body -->
    <ellipse cx="40" cy="52" rx="20" ry="22" fill="#C8893A"/>

    <!-- belly -->
    <ellipse cx="40" cy="56" rx="12" ry="14" fill="#F5D98B"/>

    <!-- head -->
    <ellipse cx="40" cy="28" rx="18" ry="17" fill="#C8893A"/>

    <!-- ear tufts -->
    <polygon points="27,14 24,4 31,12" fill="#8B5E1A"/>
    <polygon points="53,14 56,4 49,12" fill="#8B5E1A"/>

    <!-- left eye white -->
    <circle cx="32" cy="28" r="7" fill="white"/>
    <!-- right eye white -->
    <circle cx="48" cy="28" r="7" fill="white"/>

    <!-- left pupil (looking slightly up-right, curious) -->
    <circle cx="33" cy="27" r="4" fill="#3A2000"/>
    <!-- right pupil -->
    <circle cx="49" cy="27" r="4" fill="#3A2000"/>

    <!-- eye shine left -->
    <circle cx="35" cy="25" r="1.5" fill="white"/>
    <!-- eye shine right -->
    <circle cx="51" cy="25" r="1.5" fill="white"/>

    <!-- raised right eyebrow (questioning) -->
    <path d="M44,20 Q48,17 53,20" stroke="#8B5E1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- flatter left eyebrow -->
    <path d="M27,21 Q31,20 36,21" stroke="#8B5E1A" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- beak -->
    <polygon points="40,33 36,38 44,38" fill="#E8A020"/>

    <!-- left wing -->
    <ellipse cx="22" cy="55" rx="7" ry="13" fill="#A06820" transform="rotate(-10,22,55)"/>

    <!-- right wing (slightly raised, gesturing) -->
    <ellipse cx="58" cy="53" rx="7" ry="13" fill="#A06820" transform="rotate(5,58,53)"/>

    <!-- thought bubble dots -->
    <circle cx="60" cy="18" r="2" fill="#F5D98B" opacity="0.9"/>
    <circle cx="65" cy="12" r="3" fill="#F5D98B" opacity="0.9"/>
    <circle cx="71" cy="7" r="4" fill="#F5D98B" opacity="0.9"/>

    <!-- feet -->
    <line x1="34" y1="73" x2="30" y2="78" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="73" x2="34" y2="79" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="73" x2="38" y2="78" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="73" x2="42" y2="78" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="73" x2="46" y2="79" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="73" x2="50" y2="78" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>

  </g>
</svg>
