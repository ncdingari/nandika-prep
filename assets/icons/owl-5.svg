<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- owl-5: star above head, big smile (excellent/praise pose) -->

  <!-- body -->
  <ellipse cx="40" cy="53" rx="20" ry="21" fill="#C8893A"/>

  <!-- belly -->
  <ellipse cx="40" cy="57" rx="12" ry="13" fill="#F5D98B"/>

  <!-- head -->
  <ellipse cx="40" cy="30" rx="18" ry="17" fill="#C8893A"/>

  <!-- ear tufts -->
  <polygon points="27,16 24,6 31,14" fill="#8B5E1A"/>
  <polygon points="53,16 56,6 49,14" fill="#8B5E1A"/>

  <!-- star above head -->
  <polygon points="40,2 42,7 48,7 43,11 45,17 40,13 35,17 37,11 32,7 38,7"
           fill="#F5C842" stroke="#E8A020" stroke-width="0.5"/>

  <!-- left eye white -->
  <circle cx="32" cy="30" r="7" fill="white"/>
  <!-- right eye white -->
  <circle cx="48" cy="30" r="7" fill="white"/>

  <!-- left pupil (looking forward, happy) -->
  <circle cx="32" cy="30" r="4" fill="#3A2000"/>
  <!-- right pupil -->
  <circle cx="48" cy="30" r="4" fill="#3A2000"/>

  <!-- eye shine left -->
  <circle cx="34" cy="28" r="1.5" fill="white"/>
  <!-- eye shine right -->
  <circle cx="50" cy="28" r="1.5" fill="white"/>

  <!-- rosy cheeks -->
  <circle cx="27" cy="35" r="5" fill="#E87070" opacity="0.45"/>
  <circle cx="53" cy="35" r="5" fill="#E87070" opacity="0.45"/>

  <!-- beak -->
  <polygon points="40,35 36,40 44,40" fill="#E8A020"/>

  <!-- big open smile below beak -->
  <path d="M33,40 Q40,49 47,40" stroke="#C87010" stroke-width="2" fill="#F5D98B" stroke-linecap="round"/>

  <!-- wings raised in triumph -->
  <ellipse cx="19" cy="49" rx="7" ry="14" fill="#A06820" transform="rotate(-30,19,49)"/>
  <ellipse cx="61" cy="49" rx="7" ry="14" fill="#A06820" transform="rotate(30,61,49)"/>

  <!-- small sparkle stars around -->
  <polygon points="10,25 11,28 14,28 12,30 13,33 10,31 7,33 8,30 6,28 9,28"
           fill="#F5C842" opacity="0.85"/>
  <polygon points="70,25 71,28 74,28 72,30 73,33 70,31 67,33 68,30 66,28 69,28"
           fill="#F5C842" opacity="0.85"/>

  <!-- feet -->
  <line x1="34" y1="73" x2="30" y2="78" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="73" x2="34" y2="79" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="73" x2="38" y2="78" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="73" x2="42" y2="78" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="73" x2="46" y2="79" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="73" x2="50" y2="78" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
</svg>
